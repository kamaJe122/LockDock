name: Build & Publish Signed Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version tag prefix (e.g. v2.1.0)"
        required: true
        type: string
      version_code:
        description: "Numeric Android versionCode (e.g. 11)"
        required: true
        type: string
      release_notes:
        description: "Markdown release notes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore lockdock-release.jks from GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.LOCKDOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Secret LOCKDOCK_KEYSTORE_BASE64 is missing!" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > lockdock-release.jks

      - name: Build Signed Release APK
        env:
          LOCKDOCK_STORE_PASS: ${{ secrets.LOCKDOCK_STORE_PASS }}
          LOCKDOCK_KEY_ALIAS: ${{ secrets.LOCKDOCK_KEY_ALIAS }}
          LOCKDOCK_KEY_PASS: ${{ secrets.LOCKDOCK_KEY_PASS }}
        run: |
          gradle assembleRelease --no-daemon

      - name: Create Tag & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER_NAME: ${{ inputs.version_name }}
          VER_CODE: ${{ inputs.version_code }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          TAG="${VER_NAME}-b${VER_CODE}"
          APK_NAME="LockDock-${VER_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"

          NOTES_FILE=$(mktemp)
          printf '%s\n\n[build:%s]\n' "${NOTES}" "${VER_CODE}" > "${NOTES_FILE}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "LockDock ${VER_NAME}" --notes-file "${NOTES_FILE}"
            gh release upload "${TAG}" "${APK_NAME}#${APK_NAME}" --clobber
          else
            gh release create "${TAG}" "${APK_NAME}#${APK_NAME}" \
              --target main \
              --title "LockDock ${VER_NAME}" \
              --notes-file "${NOTES_FILE}"
          fi

      - name: Shred temporary keystore
        if: always()
        run: rm -f lockdock-release.jks
